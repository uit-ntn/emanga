version: 1
backend:
  phases:
    build:
      commands:
        # npm ci rejects the inconsistent bundled deps shipped inside @aws-amplify/data-construct
        # and @aws-amplify/graphql-api-construct (semver / @opentelemetry/core); npm install accepts them
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        # deploys amplify/ (reader API Lambda + Function URL) and writes amplify_outputs.json
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - export VITE_READER_API=$(node -p "require('./amplify_outputs.json').custom.readerApiUrl")
        - echo "Reader API -> $VITE_READER_API"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
