version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # deploys amplify/ (reader API Lambda + Function URL) and writes amplify_outputs.json
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - export VITE_READER_API=$(node -p "require('./amplify_outputs.json').custom.readerApiUrl")
        - echo "Reader API -> $VITE_READER_API"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
